name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Smoke test on this OS (runtimes, egress list)
        shell: bash
        run: |
          go run ./cmd/mamori egress
          set +e
          go run ./cmd/mamori scan --runtimes --format markdown --out runtimes.md
          code=$?
          cat runtimes.md
          # 0 clean, 1 findings, 3 blind spots are all valid outcomes here; 2 is a crash.
          test "$code" -ne 2

  self-scan:
    # mamori scans its own dependencies on every change and fails on findings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan this repository
        run: |
          set +e
          go run ./cmd/mamori scan --local . --lang en --format markdown --out scan.md
          code=$?
          cat scan.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
